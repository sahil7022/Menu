<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7b1fa2">
<title>Navrang · Orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Yatra+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
  .wrap { max-width: 1280px; margin: 0 auto; padding: 18px 20px 40px; }
  header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; justify-content: space-between; }
  header.top h1 { margin: 0; font-size: 2rem; display: flex; align-items: center; gap: 10px; }
  header.top h1 .ic { padding: 8px; width: 42px; height: 42px; border-radius: 12px; background: var(--cta); color: #fff; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 700; color: var(--green-ink); background: color-mix(in srgb, var(--green) 12%, #fff); padding: 4px 10px; border-radius: var(--r-full); font-family: var(--font); }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 20px 0; }
  .stat { padding: 16px 18px; display: flex; gap: 14px; align-items: center; }
  .stat .ic { padding: 10px; width: 46px; height: 46px; border-radius: 14px; color: var(--ci); background: color-mix(in srgb, var(--c) 13%, #fff); }
  .stat .v { font-size: 1.6rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat .l { color: var(--ink-2); font-size: .85rem; font-weight: 600; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; align-items: center; }
  .seg { display: inline-flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-full); position: relative; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .seg::-webkit-scrollbar { display: none; }
  .chip { flex: none; }
  .chip { position: relative; z-index: 1; border: 0; background: none; min-height: 40px; padding: 8px 14px; border-radius: var(--r-full); font-weight: 700; font-size: .9rem; color: var(--ink-2); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .chip.on { color: #fff; }
  .chip b { font-size: .75rem; min-width: 20px; padding: 1px 6px; border-radius: 10px; background: var(--surface-2); color: var(--ink-2); }
  .chip.on b { background: rgba(255,255,255,.25); color: #fff; }
  .seg .pillbg { position: absolute; z-index: 0; top: 4px; height: calc(100% - 8px); border-radius: var(--r-full); background: var(--brand); }
  .filters .field { flex: 1; min-width: 200px; max-width: 320px; }
  .filters input { min-height: 48px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; align-items: start; }
  .order { padding: 16px; display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden; }
  .order::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--c); }
  .order .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .order .no { font-family: var(--display); font-size: 1.7rem; color: var(--ci); line-height: 1; }
  .order .who { font-weight: 800; font-size: 1.15rem; display: flex; align-items: center; gap: 8px; }
  .order .who .ic { color: var(--ink-2); }
  .order ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
  .order li { display: flex; gap: 8px; align-items: baseline; }
  .order li .q { min-width: 32px; text-align: center; font-weight: 800; color: var(--ci); background: color-mix(in srgb, var(--c) 12%, #fff); border-radius: 8px; padding: 1px 6px; font-size: .9rem; }
  .order li .p { margin-left: auto; color: var(--ink-2); font-size: .88rem; font-variant-numeric: tabular-nums; }
  .order .note { display: flex; gap: 6px; background: #fff6dc; color: #6b4a00; border-radius: 10px; padding: 8px 10px; font-size: .9rem; }
  .order .foot { display: flex; justify-content: space-between; align-items: center; padding-top: 8px; border-top: 1px dashed var(--line); }
  .order .foot b { font-size: 1.15rem; }
  .order .time { display: inline-flex; gap: 4px; align-items: center; color: var(--ink-2); font-size: .85rem; }
  .order .acts { display: flex; gap: 8px; }
  .order .acts .btn:first-child { flex: 1; }
  .order.new-glow { box-shadow: 0 0 0 3px color-mix(in srgb, var(--pink) 50%, transparent), var(--shadow-md); }

  #login { max-width: 400px; margin: 8vh auto; padding: 28px; text-align: center; display: grid; gap: 14px; }
  #login .mandala { margin: 0 auto -6px; width: 96px; height: 96px; }
  #login h2 { margin: 0; color: var(--brand); font-size: 1.7rem; }

  .lower { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 26px; }
  .summary { padding: 18px; }
  .summary h3 { margin: 0 0 10px; color: var(--brand); font-size: 1.3rem; }
  .bar-row { display: grid; grid-template-columns: minmax(110px, 200px) 1fr 70px; gap: 12px; align-items: center; padding: 6px 0; font-size: .92rem; }
  .bar-row .track { height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
  .bar-row .track i { display: block; height: 100%; width: 0; border-radius: 5px; background: var(--c); }
  .bar-row .amt { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  @media (max-width: 560px) {
    .wrap { padding: 14px 14px 32px; }
    .stat { padding: 12px; gap: 10px; } .stat .ic { width: 38px; height: 38px; padding: 8px; } .stat .v { font-size: 1.3rem; }
    .stats { grid-template-columns: 1fr 1fr; }
    .stats .stat:nth-child(2) { grid-column: span 2; order: -1; }
    .filters .field { max-width: none; }
    .bar-row { grid-template-columns: 1fr 70px; } .bar-row .track { grid-column: 1 / -1; grid-row: 2; }
  }
  .empty { grid-column: 1 / -1; padding: 50px 20px; text-align: center; color: var(--ink-2); }
  .empty .ic { margin: 0 auto 8px; color: #c9b3cd; }
</style>
</head>
<body>
<div class="toran" aria-hidden="true"></div>

<form id="login" class="card hidden">
  <div class="mandala" aria-hidden="true"></div>
  <h2>Staff login</h2>
  <p class="muted" style="margin:-6px 0 4px">Enter the stall PIN to see orders.</p>
  <label class="sr-only" for="pin">PIN</label>
  <div class="field"><span class="i-lock"></span><input id="pin" type="password" inputmode="numeric" placeholder="PIN" autocomplete="current-password"></div>
  <p class="err" id="loginErr" role="alert" style="color:var(--red-ink);margin:0;min-height:1.3em;font-weight:600"></p>
  <button class="btn block" data-press>Open orders</button>
</form>

<div class="wrap hidden" id="app">
  <header class="top">
    <h1 class="display"><span class="i-list"></span>Orders <span class="live"><i></i>Live</span></h1>
    <div class="tools">
      <button class="btn small ghost" id="sound" data-press></button>
      <a class="btn small ghost" href="/qr" target="_blank" rel="noopener" data-press><span class="i-qr"></span>QR poster</a>
      <button class="btn small ghost" id="export" data-press><span class="i-dl"></span>Export CSV</button>
      <button class="btn small ghost" id="logout" data-press aria-label="Log out"><span class="i-out"></span></button>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="filters">
    <div class="seg" id="seg" role="tablist" aria-label="Filter orders">
      <span class="pillbg" id="pillbg"></span>
      <button class="chip on" data-f="active" role="tab">Active <b id="n-active">0</b></button>
      <button class="chip" data-f="new" role="tab">New <b id="n-new">0</b></button>
      <button class="chip" data-f="preparing" role="tab">Preparing <b id="n-preparing">0</b></button>
      <button class="chip" data-f="ready" role="tab">Ready <b id="n-ready">0</b></button>
      <button class="chip" data-f="done" role="tab">Done <b id="n-done">0</b></button>
      <button class="chip" data-f="all" role="tab">All</button>
    </div>
    <div class="field"><span class="i-search"></span><input id="search" type="search" placeholder="Search name or #number" aria-label="Search orders"></div>
  </div>

  <div class="grid" id="orders" aria-live="polite"></div>

  <div class="lower">
    <div class="summary card">
      <h3>Item-wise sales</h3>
      <div id="summary"></div>
    </div>
  </div>
  <p style="text-align:right;margin-top:20px"><button class="btn small danger" id="clear" data-press><span class="i-trash"></span>Clear all orders</button></p>
</div>

<script src="/vendor/motion.js"></script>
<script src="/fx.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const { animate, SPRING, SOFT } = fx;
const money = (n) => '₹' + Math.round(n).toLocaleString('en-IN');
const put = (sel, html) => document.querySelectorAll(sel).forEach((e) => { e.outerHTML = html; });
put('.i-lock', icon('lock', 20)); put('.i-list', icon('list', 26)); put('.i-qr', icon('qr', 18)); put('.i-dl', icon('download', 18));
put('.i-out', icon('logout', 18)); put('.i-search', icon('search', 20)); put('.i-trash', icon('trash', 18));

let pin = sessionStorage.getItem('navrang_pin') || '';
let orders = [], filter = 'active', seen = null, soundOn = true, timer, lastSig = '';
const fresh = new Set();
const NEXT = { new: ['preparing', 'Start preparing', 'chef'], preparing: ['ready', 'Mark ready', 'checkCircle'], ready: ['done', 'Collected', 'check'] };
const ACTIVE = ['new', 'preparing', 'ready'];

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', 'X-Admin-Pin': pin, ...(opts.headers || {}) } });
  if (r.status === 401) { logout('Wrong PIN, try again'); throw new Error('auth'); }
  return r.json();
}

function beep() {
  if (!soundOn) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [880, 1175, 1568].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f; o.connect(g); g.connect(ctx.destination);
      const t = ctx.currentTime + i * .15; g.gain.setValueAtTime(.2, t); g.gain.exponentialRampToValueAtTime(.001, t + .3);
      o.start(t); o.stop(t + .3);
    });
  } catch {}
}
function renderSound() { $('sound').innerHTML = icon(soundOn ? 'bell' : 'bellOff', 18) + (soundOn ? 'Sound on' : 'Sound off'); }
renderSound();

async function load() {
  try { orders = await api('/api/admin/orders'); } catch { return; }
  if (seen) {
    const n = orders.filter((o) => !seen.has(o.id));
    if (n.length) { n.forEach((o) => fresh.add(o.id)); beep(); document.title = `(${n.length}) New order!`; setTimeout(() => (document.title = 'Navrang · Orders'), 4000); }
  }
  seen = new Set(orders.map((o) => o.id));
  render();
}

const STATS = [
  ['Orders', 'receipt', '--purple', '#7b1fa2', (l) => l.length],
  ['Revenue', 'wallet', '--green', '#15803d', (l) => l.reduce((s, o) => s + o.total, 0), money],
  ['New', 'bell', '--orange', '#b45309', (l) => l.filter((o) => o.status === 'new').length],
  ['Preparing', 'chef', '--royal', '#1d3fbf', (l) => l.filter((o) => o.status === 'preparing').length],
  ['Ready', 'checkCircle', '--peacock', '#0f766e', (l) => l.filter((o) => o.status === 'ready').length],
];
$('stats').innerHTML = STATS.map(([l, ic, c, ci], i) =>
  `<div class="stat card" style="--c:var(${c});--ci:${ci}">${icon(ic, 26)}<div><div class="v" id="sv${i}">0</div><div class="l">${l}</div></div></div>`).join('');

function orderCard(o) {
  const nx = NEXT[o.status];
  return `<article class="order card st-${o.status} ${fresh.has(o.id) ? 'new-glow' : ''}" data-key="${o.id}">
    <div class="top"><span class="no">#${o.no}</span><span class="pill">${o.status}</span></div>
    <div class="who">${icon('user', 18)}${esc(o.name)}</div>
    <ul>${o.items.map((i) => `<li><span class="q">${i.qty}×</span><span>${esc(i.name)}</span><span class="p">${money(i.price * i.qty)}</span></li>`).join('')}</ul>
    ${o.note ? `<div class="note">${icon('note', 16)}<span>${esc(o.note)}</span></div>` : ''}
    <div class="foot"><b>${money(o.total)}</b><span class="time">${icon('clock', 14)}${new Date(o.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span></div>
    <div class="acts">
      ${nx ? `<button class="btn small" data-id="${o.id}" data-s="${nx[0]}" data-press>${icon(nx[2], 18)}${nx[1]}</button>` : ''}
      ${['new', 'preparing'].includes(o.status) ? `<button class="btn small ghost" data-id="${o.id}" data-s="cancelled" data-press aria-label="Cancel order ${o.no}">${icon('x', 18)}</button>` : ''}
      ${['done', 'cancelled'].includes(o.status) ? `<button class="btn small ghost" data-id="${o.id}" data-s="new" data-press>${icon('undo', 18)}Reopen</button>` : ''}
    </div>
  </article>`;
}

function render(force) {
  const live = orders.filter((o) => o.status !== 'cancelled');
  STATS.forEach(([, , , , f, fmt], i) => fx.count($('sv' + i), f(live), fmt));
  $('n-active').textContent = orders.filter((o) => ACTIVE.includes(o.status)).length;
  for (const s of ['new', 'preparing', 'ready', 'done']) $('n-' + s).textContent = orders.filter((o) => o.status === s).length;

  const q = $('search').value.trim().toLowerCase().replace(/^#/, '');
  const list = orders.filter((o) =>
    (filter === 'all' || (filter === 'active' ? ACTIVE.includes(o.status) : o.status === filter)) &&
    (!q || o.name.toLowerCase().includes(q) || String(o.no) === q)
  ).sort((a, b) => (['active', 'new', 'preparing'].includes(filter) ? a.no - b.no : b.no - a.no));

  // Only touch the DOM when something actually changed (keeps animations smooth while polling)
  const sig = filter + '|' + q + '|' + list.map((o) => o.id + o.status + (fresh.has(o.id) ? '*' : '')).join(',');
  if (sig !== lastSig || force) {
    lastSig = sig;
    fx.flip($('orders'), () => {
      $('orders').innerHTML = list.map(orderCard).join('') ||
        `<div class="empty">${icon('utensils', 40)}<p><b>No orders here yet</b><br>New orders pop up automatically.</p></div>`;
    });
    fx.pressable($('orders'));
    renderSummary(live);
  }
}

function renderSummary(live) {
  const agg = new Map();
  for (const o of live) for (const i of o.items) { const a = agg.get(i.name) || { qty: 0, amt: 0 }; a.qty += i.qty; a.amt += i.qty * i.price; agg.set(i.name, a); }
  const rows = [...agg].sort((a, b) => b[1].qty - a[1].qty);
  const max = Math.max(1, ...rows.map(([, a]) => a.qty));
  $('summary').innerHTML = rows.map(([n, a], i) =>
    `<div class="bar-row" style="--c:${NINE[i % 9][0]}"><span><b>${a.qty}×</b> ${esc(n)}</span><span class="track"><i data-w="${(a.qty / max) * 100}"></i></span><span class="amt">${money(a.amt)}</span></div>`).join('')
    || '<p class="muted" style="margin:0">Nothing sold yet.</p>';
  $('summary').querySelectorAll('.track i').forEach((el, i) =>
    animate(el, { width: ['0%', el.dataset.w + '%'] }, { duration: 0.7, delay: i * 0.04, ease: [0.2, 0.7, 0.3, 1] }));
}

function movePill(animated = true) {
  const on = document.querySelector('.chip.on'), seg = $('seg'), pb = $('pillbg');
  const r = on.getBoundingClientRect(), s = seg.getBoundingClientRect();
  const kf = { left: r.left - s.left + 'px', top: r.top - s.top + 'px', width: r.width + 'px', height: r.height + 'px' };
  if (animated && fx.ok) animate(pb, kf, { type: 'spring', stiffness: 500, damping: 38 });
  else Object.assign(pb.style, kf);
}
addEventListener('resize', () => movePill(false));

document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-s]');
  if (b) {
    if (b.dataset.s === 'cancelled' && !confirm('Cancel this order?')) return;
    b.disabled = true; fresh.delete(b.dataset.id);
    const card = b.closest('.order');
    const leaving = filter !== 'all' && !(filter === 'active' ? ACTIVE.includes(b.dataset.s) : b.dataset.s === filter);
    const req = api('/api/admin/orders/' + b.dataset.id, { method: 'PATCH', body: JSON.stringify({ status: b.dataset.s }) }).catch(() => {});
    if (leaving) await animate(card, { opacity: 0, scale: 0.9, y: 10 }, { duration: 0.22 });
    else fx.pop(card, 1.03);
    await req;
    return load();
  }
  const c = e.target.closest('.chip');
  if (c) {
    filter = c.dataset.f;
    document.querySelectorAll('.chip').forEach((x) => { x.classList.toggle('on', x === c); x.setAttribute('aria-selected', x === c); });
    movePill(); render();
  }
  const card = e.target.closest('.order.new-glow');
  if (card) { fresh.delete(card.dataset.key); card.classList.remove('new-glow'); }
});
$('search').oninput = () => render();
$('sound').onclick = () => { soundOn = !soundOn; renderSound(); if (soundOn) beep(); };
$('clear').onclick = async () => { if (confirm('Delete ALL orders? This cannot be undone.')) { await api('/api/admin/orders', { method: 'DELETE' }); seen = null; load(); } };
$('export').onclick = () => {
  const rows = [['No', 'Name', 'Items', 'Total', 'Status', 'Time', 'Note']].concat(orders.map((o) =>
    [o.no, o.name, o.items.map((i) => `${i.qty}x ${i.name}`).join('; '), o.total, o.status, new Date(o.createdAt).toLocaleString(), o.note || '']));
  const csv = rows.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `navrang-orders-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
};

function logout(msg) {
  clearInterval(timer); pin = ''; sessionStorage.removeItem('navrang_pin');
  $('app').classList.add('hidden'); $('login').classList.remove('hidden');
  $('loginErr').textContent = msg || '';
  if (msg) fx.shake($('login')); else animate($('login'), { opacity: [0, 1], y: [20, 0] }, SOFT);
  $('pin').value = ''; $('pin').focus();
}
$('logout').onclick = () => logout();
$('login').onsubmit = (e) => { e.preventDefault(); pin = $('pin').value; if (!pin) return fx.shake($('pin')); start(); };

async function start() {
  try { orders = await api('/api/admin/orders'); } catch { return; }
  sessionStorage.setItem('navrang_pin', pin);
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  seen = new Set(orders.map((o) => o.id));
  movePill(false);
  fx.enter(document.querySelectorAll('.stat'), { gap: 0.06 });
  render(true);
  fx.pressable();
  clearInterval(timer); timer = setInterval(load, 4000);
}
pin ? start() : logout();
</script>
</body>
</html>
