<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7b1fa2">
<title>Navrang · Orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Yatra+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
  .wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; justify-content: space-between; }
  header h1 { margin: 0; font-size: 2rem; color: var(--purple); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 16px 0; }
  .stat { padding: 14px 16px; border-top: 5px solid var(--c); }
  .stat .v { font-size: 1.7rem; font-weight: 700; }
  .stat .l { color: var(--muted); font-size: .9rem; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: center; }
  .chip { border: 2px solid var(--purple); background: #fff; color: var(--purple); font: inherit; font-weight: 600; padding: 6px 14px; border-radius: 999px; cursor: pointer; }
  .chip.on { background: var(--purple); color: #fff; }
  .filters input { max-width: 240px; padding: 8px 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .order { padding: 14px 16px; border-left: 7px solid var(--c); display: flex; flex-direction: column; gap: 8px; }
  .order.fresh { animation: pop 1.2s ease 3; }
  @keyframes pop { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--pink) 45%, transparent); } }
  .order .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .order .no { font-family: "Yatra One", serif; font-size: 1.6rem; color: var(--c); }
  .order .who { font-weight: 700; font-size: 1.15rem; }
  .order ul { margin: 0; padding-left: 18px; }
  .order .note { background: #fff4d6; border-radius: 10px; padding: 6px 10px; font-size: .9rem; }
  .order .foot { display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
  .order .acts { display: flex; flex-wrap: wrap; gap: 6px; }
  .status { padding: 3px 10px; border-radius: 999px; font-size: .75rem; font-weight: 700; color: #fff; text-transform: uppercase; }
  .st-new { --c: var(--orange); } .st-preparing { --c: var(--royal); } .st-ready { --c: var(--green); } .st-done { --c: var(--grey); } .st-cancelled { --c: var(--red); }
  .status { background: var(--c); }
  #login { max-width: 380px; margin: 60px auto; padding: 26px; text-align: center; display: grid; gap: 12px; }
  .summary { padding: 14px 16px; margin-top: 22px; }
  .summary table { width: 100%; border-collapse: collapse; }
  .summary td { padding: 6px 4px; border-bottom: 1px dashed #ead7ef; }
  .summary td:not(:first-child) { text-align: right; }
  .empty { padding: 40px; text-align: center; }
</style>
</head>
<body>
<div class="toran"></div>

<form id="login" class="card hidden">
  <div class="mandala" style="margin:0 auto"></div>
  <h2 style="margin:0;color:var(--purple)">Staff login</h2>
  <input id="pin" type="password" inputmode="numeric" placeholder="Enter PIN" required>
  <p id="loginErr" style="color:var(--red);margin:0;min-height:1.2em"></p>
  <button class="btn">Open orders</button>
</form>

<div class="wrap hidden" id="app">
  <header>
    <h1>📋 Orders</h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn small ghost" id="sound">🔔 Sound on</button>
      <a class="btn small ghost" href="/qr" target="_blank" style="text-decoration:none">QR code</a>
      <button class="btn small ghost" id="export">Export CSV</button>
      <button class="btn small ghost" id="logout">Log out</button>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="filters" id="filters">
    <button class="chip on" data-f="active">Active</button>
    <button class="chip" data-f="new">New</button>
    <button class="chip" data-f="preparing">Preparing</button>
    <button class="chip" data-f="ready">Ready</button>
    <button class="chip" data-f="done">Done</button>
    <button class="chip" data-f="all">All</button>
    <input id="search" placeholder="Search name or #no">
  </div>

  <div class="grid" id="orders"></div>

  <div class="summary card">
    <h3 style="margin:0 0 8px;color:var(--purple)">Item-wise totals (excluding cancelled)</h3>
    <table id="summary"></table>
  </div>
  <p style="text-align:right;margin-top:20px"><button class="btn small ghost" id="clear" style="color:var(--red);box-shadow:inset 0 0 0 2px var(--red)">Clear all orders</button></p>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => '₹' + n.toLocaleString('en-IN');
let pin = sessionStorage.getItem('navrang_pin') || '';
let orders = [], filter = 'active', seen = null, soundOn = true, timer;
const fresh = new Set();
const NEXT = { new: ['preparing', 'Start'], preparing: ['ready', 'Mark ready'], ready: ['done', 'Collected'] };

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', 'X-Admin-Pin': pin, ...(opts.headers || {}) } });
  if (r.status === 401) { logout('Wrong PIN'); throw new Error('auth'); }
  return r.json();
}

function beep() {
  if (!soundOn) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [880, 1175, 1568].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f; o.connect(g); g.connect(ctx.destination);
      const t = ctx.currentTime + i * .15; g.gain.setValueAtTime(.2, t); g.gain.exponentialRampToValueAtTime(.001, t + .3);
      o.start(t); o.stop(t + .3);
    });
  } catch {}
}

async function load() {
  try { orders = await api('/api/admin/orders'); } catch { return; }
  if (seen) { const n = orders.filter((o) => !seen.has(o.id)); if (n.length) { n.forEach((o) => fresh.add(o.id)); beep(); document.title = `(${n.length}) New order!`; setTimeout(() => document.title = 'Navrang · Orders', 4000); } }
  seen = new Set(orders.map((o) => o.id));
  render();
}

function render() {
  const live = orders.filter((o) => o.status !== 'cancelled');
  const count = (s) => orders.filter((o) => o.status === s).length;
  $('stats').innerHTML = [
    ['Orders', live.length, '--purple'],
    ['Revenue', money(live.reduce((s, o) => s + o.total, 0)), '--green'],
    ['New', count('new'), '--orange'],
    ['Preparing', count('preparing'), '--royal'],
    ['Ready', count('ready'), '--peacock'],
  ].map(([l, v, c]) => `<div class="stat card" style="--c:var(${c})"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');

  const q = $('search').value.trim().toLowerCase().replace(/^#/, '');
  const list = orders.filter((o) =>
    (filter === 'all' || (filter === 'active' ? ['new', 'preparing', 'ready'].includes(o.status) : o.status === filter)) &&
    (!q || o.name.toLowerCase().includes(q) || String(o.no) === q)
  ).sort((a, b) => filter === 'active' || filter === 'new' || filter === 'preparing' ? a.no - b.no : b.no - a.no);

  $('orders').innerHTML = list.map((o) => `
    <div class="order card st-${o.status} ${fresh.has(o.id) ? 'fresh' : ''}">
      <div class="top"><span class="no">#${o.no}</span><span class="status">${o.status}</span></div>
      <div class="who">${esc(o.name)}</div>
      <ul>${o.items.map((i) => `<li><b>${i.qty} ×</b> ${esc(i.name)} <span class="muted">(${money(i.price * i.qty)})</span></li>`).join('')}</ul>
      ${o.note ? `<div class="note">📝 ${esc(o.note)}</div>` : ''}
      <div class="foot"><span>${money(o.total)}</span><span class="muted" style="font-weight:400">${new Date(o.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span></div>
      <div class="acts">
        ${NEXT[o.status] ? `<button class="btn small" data-id="${o.id}" data-s="${NEXT[o.status][0]}">${NEXT[o.status][1]}</button>` : ''}
        ${['new', 'preparing'].includes(o.status) ? `<button class="btn small ghost" data-id="${o.id}" data-s="cancelled">Cancel</button>` : ''}
        ${['done', 'cancelled'].includes(o.status) ? `<button class="btn small ghost" data-id="${o.id}" data-s="new">Reopen</button>` : ''}
      </div>
    </div>`).join('') || '<div class="empty card muted">No orders here yet. 🪔</div>';

  const agg = new Map();
  for (const o of live) for (const i of o.items) { const a = agg.get(i.name) || { qty: 0, amt: 0 }; a.qty += i.qty; a.amt += i.qty * i.price; agg.set(i.name, a); }
  $('summary').innerHTML = [...agg].sort((a, b) => b[1].qty - a[1].qty)
    .map(([n, a]) => `<tr><td>${esc(n)}</td><td>${a.qty}</td><td>${money(a.amt)}</td></tr>`).join('') || '<tr><td class="muted">Nothing sold yet</td></tr>';
}

document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-s]');
  if (b) {
    if (b.dataset.s === 'cancelled' && !confirm('Cancel this order?')) return;
    b.disabled = true; fresh.delete(b.dataset.id);
    await api('/api/admin/orders/' + b.dataset.id, { method: 'PATCH', body: JSON.stringify({ status: b.dataset.s }) }).catch(() => {});
    return load();
  }
  const c = e.target.closest('[data-f]');
  if (c) { filter = c.dataset.f; document.querySelectorAll('.chip').forEach((x) => x.classList.toggle('on', x === c)); render(); }
});
$('search').oninput = render;
$('sound').onclick = () => { soundOn = !soundOn; $('sound').textContent = soundOn ? '🔔 Sound on' : '🔕 Sound off'; if (soundOn) beep(); };
$('clear').onclick = async () => { if (confirm('Delete ALL orders? This cannot be undone.')) { await api('/api/admin/orders', { method: 'DELETE' }); seen = null; load(); } };
$('export').onclick = () => {
  const rows = [['No', 'Name', 'Items', 'Total', 'Status', 'Time', 'Note']].concat(orders.map((o) =>
    [o.no, o.name, o.items.map((i) => `${i.qty}x ${i.name}`).join('; '), o.total, o.status, new Date(o.createdAt).toLocaleString(), o.note || '']));
  const csv = rows.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `navrang-orders-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
};

function logout(msg) {
  clearInterval(timer); pin = ''; sessionStorage.removeItem('navrang_pin');
  $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('loginErr').textContent = msg || '';
}
$('logout').onclick = () => logout();
$('login').onsubmit = (e) => { e.preventDefault(); pin = $('pin').value; start(); };

async function start() {
  try { orders = await api('/api/admin/orders'); } catch { return; }
  sessionStorage.setItem('navrang_pin', pin);
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  seen = new Set(orders.map((o) => o.id)); render();
  clearInterval(timer); timer = setInterval(load, 4000);
}
pin ? start() : logout();
</script>
</body>
</html>
