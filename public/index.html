<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7b1fa2">
<title>Navrang Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Yatra+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 128px; }

  /* ---------- Hero ---------- */
  .hero { text-align: center; padding: 28px 16px 6px; position: relative; overflow: hidden; }
  .hero .mandala { position: absolute; opacity: .22; }
  .hero .m1 { left: -46px; top: -34px; }
  .hero .m2 { right: -46px; top: 18px; animation-direction: reverse; }
  .hero h1 { margin: 0; font-size: clamp(2rem, 9vw, 2.6rem); line-height: 1.1; }
  .hero h1 .w { display: inline-block; }
  .hero p { margin: 6px 0 0; font-size: .95rem; }
  .hero.compact { padding: 14px 16px 0; }
  .hero.compact h1 { font-size: 1.6rem; }
  .hero.compact p, .hero.compact .mandala { display: none; }

  /* ---------- Name screen ---------- */
  #nameScreen { margin-top: 20px; padding: 26px 22px; text-align: center; }
  #nameScreen .badge { width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 20px; display: grid; place-items: center; color: #fff; background: var(--cta); box-shadow: var(--shadow-cta); }
  #nameScreen h2 { margin: 0; font-size: 1.7rem; color: var(--brand); }
  #nameScreen form { display: grid; gap: 12px; margin-top: 20px; text-align: left; }
  #nameScreen label { font-weight: 700; font-size: .9rem; }
  .perks { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .perk { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--r-full); font-size: .82rem; font-weight: 600; background: var(--surface-2); color: var(--ink-2); }

  /* ---------- Sticky menu header ---------- */
  .bar { position: sticky; top: 0; z-index: 8; padding: 10px 0 8px; margin: 0 -16px; padding-inline: 16px;
    background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .bar.scrolled { box-shadow: 0 6px 16px -10px rgba(42, 10, 50, .25); }
  .greet { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
  .greet b { font-size: 1.05rem; }
  .linkbtn { background: none; border: 0; padding: 10px 4px; min-height: 44px; color: var(--brand); font-weight: 700; font-size: .88rem; cursor: pointer; }
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 14px; border-radius: var(--r-full); border: 1.5px solid color-mix(in srgb, var(--c) 35%, #fff);
    background: var(--surface); color: var(--ci); font-weight: 700; font-size: .9rem; cursor: pointer; transition: background .2s var(--ease), color .2s var(--ease); }
  .tab.on { background: var(--c); border-color: var(--c); color: #fff; }

  /* ---------- Menu ---------- */
  section.cat h2 { display: flex; align-items: center; gap: 10px; margin: 22px 2px 12px; font-size: 1.45rem; color: var(--ci); }
  section.cat h2 .ic { padding: 6px; width: 34px; height: 34px; border-radius: 10px; color: #fff; background: var(--c); }
  section.cat h2::after { content: ""; flex: 1; height: 2px; border-radius: 2px; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 45%, transparent), transparent); }

  .item { display: flex; gap: 14px; padding: 14px; margin-bottom: 12px; align-items: flex-start; transition: box-shadow .2s var(--ease); }
  .item.in-cart { box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 55%, transparent), var(--shadow-sm); }
  .thumb { width: 72px; height: 72px; flex: none; border-radius: 16px; display: grid; place-items: center; color: #fff; overflow: hidden; position: relative;
    background: radial-gradient(circle at 30% 25%, color-mix(in srgb, var(--c) 60%, #fff), var(--c)); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb::after { content: ""; position: absolute; inset: 0; background: repeating-conic-gradient(rgba(255,255,255,.12) 0 10deg, transparent 10deg 20deg); }
  .info { flex: 1; min-width: 0; }
  .nm { font-weight: 700; line-height: 1.3; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .desc { font-size: .86rem; color: var(--ink-2); margin: 3px 0 8px; line-height: 1.4; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .price { font-weight: 800; font-size: 1.02rem; }
  .veg { display: inline-block; flex: none; width: 14px; height: 14px; border: 1.5px solid var(--green-ink); border-radius: 3px; position: relative; }
  .veg::after { content: ""; position: absolute; inset: 2.5px; border-radius: 50%; background: var(--green-ink); }
  .hot { font-size: .68rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--pink-ink); background: color-mix(in srgb, var(--pink) 12%, #fff); padding: 2px 8px; border-radius: var(--r-full); display: inline-flex; gap: 3px; align-items: center; }

  .add { min-width: 92px; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; border: 1.5px solid var(--c); color: var(--ci); background: var(--surface);
    font-weight: 800; letter-spacing: .04em; padding: 6px 14px; border-radius: var(--r-full); cursor: pointer; }
  .add:hover { background: color-mix(in srgb, var(--c) 8%, #fff); }
  .qty { min-width: 92px; display: inline-flex; align-items: center; justify-content: space-between; border-radius: var(--r-full); background: var(--c); color: #fff; padding: 2px; }
  .qty button { width: 38px; height: 38px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; background: transparent; color: #fff; }
  .qty button:hover { background: rgba(255, 255, 255, .18); }
  .qty span { min-width: 18px; text-align: center; font-weight: 800; }
  .empty-search { text-align: center; padding: 40px 10px; color: var(--ink-2); }

  /* ---------- Cart bar ---------- */
  .cartbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); pointer-events: none; }
  .cartbar .btn { pointer-events: auto; width: 100%; max-width: 528px; margin: 0 auto; display: flex; justify-content: space-between; min-height: 60px; padding: 8px 10px 8px 12px; border-radius: 20px; }
  .bagwrap { position: relative; width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: rgba(255,255,255,.18); }
  .count { position: absolute; top: -6px; right: -6px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: #fff; color: var(--brand); font-size: .75rem; font-weight: 800; display: grid; place-items: center; }
  .cartbar .mid { flex: 1; text-align: left; padding-left: 12px; line-height: 1.2; }
  .cartbar .mid small { display: block; opacity: .85; font-weight: 600; font-size: .78rem; }
  .cartbar .go { display: inline-flex; align-items: center; gap: 4px; padding: 10px 14px; border-radius: 14px; background: rgba(255,255,255,.18); }

  /* ---------- Sheet ---------- */
  .sheet-bg { position: fixed; inset: 0; background: rgba(42, 10, 50, .5); z-index: 20; backdrop-filter: blur(2px); }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 90dvh; display: flex; flex-direction: column; border-radius: 28px 28px 0 0; max-width: 600px; margin: 0 auto; background: var(--surface); box-shadow: var(--shadow-md); }
  .sheet .handle { width: 44px; height: 5px; border-radius: 3px; background: #e6d6e6; margin: 10px auto 0; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 18px 4px; }
  .sheet-head h2 { margin: 0; color: var(--brand); font-size: 1.6rem; }
  .iconbtn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; border: 0; background: var(--surface-2); color: var(--ink); cursor: pointer; }
  .sheet-body { overflow: auto; padding: 0 18px; }
  .line { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); --c: var(--brand); }
  .line .nm { flex: 1; font-weight: 600; display: block; }
  .line small { color: var(--ink-2); font-weight: 500; }
  .line .qty { min-width: 104px; }
  .line .amt { font-weight: 800; min-width: 54px; text-align: right; }
  .bill { margin: 14px 0; padding: 14px 16px; border-radius: var(--r-sm); background: var(--surface-2); }
  .bill .r { display: flex; justify-content: space-between; color: var(--ink-2); font-size: .92rem; }
  .bill .t { display: flex; justify-content: space-between; margin-top: 8px; padding-top: 10px; border-top: 1px dashed #e3cfe1; font-size: 1.2rem; font-weight: 800; color: var(--ink); }
  .notefield textarea { min-height: 72px; resize: vertical; padding-left: 46px; }
  .notefield .ic { top: 26px; }
  .sheet-foot { padding: 12px 18px calc(16px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); display: grid; gap: 4px; }
  .err { color: var(--red-ink); font-weight: 600; font-size: .9rem; min-height: 1.3em; margin: 0; text-align: center; }
  .spinner { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.4); border-top-color: #fff; animation: rot .7s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }

  /* ---------- Confirmation ---------- */
  #done { margin-top: 20px; padding: 26px 20px 22px; text-align: center; }
  .tick { width: 84px; height: 84px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--green) 14%, #fff); color: var(--green-ink); }
  .tick svg path, .tick svg circle { stroke-dasharray: 100; stroke-dashoffset: 0; }
  #done h2 { margin: 12px 0 0; font-size: 1.6rem; color: var(--brand); }
  .ordno { font-family: var(--display); font-size: 4rem; line-height: 1; margin: 4px 0 2px; }
  .track { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); margin: 22px 0 6px; }
  .track .rail, .track .fill { position: absolute; top: 21px; left: 16.66%; right: 16.66%; height: 4px; border-radius: 2px; background: var(--line); }
  .track .fill { right: auto; width: 0; background: linear-gradient(90deg, var(--orange), var(--royal), var(--green)); }
  .step { position: relative; display: grid; justify-items: center; gap: 6px; font-size: .8rem; font-weight: 700; color: var(--ink-2); }
  .step .dot { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 2px solid var(--line); color: #b7a6bb; }
  .step.on { color: var(--ink); }
  .step.on .dot { border-color: transparent; color: #fff; background: var(--c); }
  .step.now .dot { box-shadow: 0 0 0 6px color-mix(in srgb, var(--c) 20%, transparent); }
  .statusline { font-weight: 700; margin: 10px 0 0; }
  .receipt { text-align: left; margin: 18px 0 6px; padding: 14px 16px; border-radius: var(--r-sm); background: var(--surface-2); }
  .receipt .r { display: flex; justify-content: space-between; padding: 4px 0; font-size: .95rem; }
  .receipt .t { border-top: 1px dashed #e3cfe1; margin-top: 6px; padding-top: 8px; font-weight: 800; font-size: 1.1rem; }
  .hint { font-size: .86rem; margin: 12px 0 16px; display: inline-flex; gap: 6px; align-items: center; }
</style>
</head>
<body>
<div class="toran" aria-hidden="true"></div>
<header class="hero" id="hero">
  <div class="mandala m1" aria-hidden="true"></div><div class="mandala m2" aria-hidden="true"></div>
  <h1 class="rainbow-text" id="stallName">Navrang</h1>
  <p class="muted" id="tagline"></p>
</header>

<main class="wrap">
  <!-- Step 1: name -->
  <section id="nameScreen" class="card hidden" aria-labelledby="welcomeTitle">
    <div class="badge"></div>
    <h2 id="welcomeTitle">Kem cho! Welcome</h2>
    <p class="muted" style="margin:6px 0 0">Tell us your name — we'll call it out when your order is ready.</p>
    <form id="nameForm" novalidate>
      <label for="nameInput">Your name</label>
      <div class="field"><span class="i-user"></span><input id="nameInput" placeholder="e.g. Riya" maxlength="40" autocomplete="given-name" enterkeyhint="go"></div>
      <p class="err" id="nameErr" role="alert"></p>
      <button class="btn block" type="submit" data-press><span>See the menu</span><span class="i-arrow"></span></button>
    </form>
    <div class="perks" id="perks"></div>
  </section>

  <!-- Step 2: menu -->
  <section id="menuScreen" class="hidden">
    <div class="bar" id="bar">
      <div class="greet"><span>Hi <b id="hiName"></b> 👋</span><button class="linkbtn" id="changeName">Change name</button></div>
      <div class="field"><span class="i-search"></span><input id="search" type="search" placeholder="Search dishes" aria-label="Search dishes" autocomplete="off"></div>
      <nav class="tabs" id="tabs" aria-label="Menu categories"></nav>
    </div>
    <div id="menu" aria-live="polite">
      <div class="skel" style="height:100px;margin:16px 0 12px"></div><div class="skel" style="height:100px;margin-bottom:12px"></div><div class="skel" style="height:100px"></div>
    </div>
  </section>

  <!-- Step 3: confirmation -->
  <section id="done" class="card hidden" aria-live="polite"></section>
</main>

<div class="cartbar hidden" id="cartbar">
  <button class="btn" id="openCart" data-press aria-label="View cart">
    <span class="bagwrap"><span class="i-bag"></span><span class="count" id="cartCount">0</span></span>
    <span class="mid"><b id="cartTotal">₹0</b><small id="cartItems">0 items</small></span>
    <span class="go">View cart <span class="i-arrow-s"></span></span>
  </button>
</div>

<div class="sheet-bg hidden" id="sheetBg"></div>
<div class="sheet hidden" id="sheet" role="dialog" aria-modal="true" aria-labelledby="cartTitle">
  <div class="handle" aria-hidden="true"></div>
  <div class="sheet-head"><h2 id="cartTitle">Your cart</h2><button class="iconbtn" id="closeX" aria-label="Close cart"></button></div>
  <div class="sheet-body">
    <p class="muted" id="cartFor" style="margin:0 0 4px"></p>
    <div id="lines"></div>
    <div class="bill">
      <div class="r"><span id="billItems">Items</span><span id="billSub">₹0</span></div>
      <div class="t"><span>To pay</span><span id="sheetTotal">₹0</span></div>
    </div>
    <label class="sr-only" for="note">Special request</label>
    <div class="field notefield"><span class="i-note"></span><textarea id="note" placeholder="Any request? (less spicy, no onion…)" maxlength="140"></textarea></div>
  </div>
  <div class="sheet-foot">
    <p class="err" id="err" role="alert"></p>
    <button class="btn block" id="placeOrder" data-press>Place order</button>
    <button class="linkbtn" id="closeCart">+ Add more items</button>
  </div>
</div>

<script src="/vendor/motion.js"></script>
<script src="/fx.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const { animate, SPRING, SOFT } = fx;
let menu, cur = '₹';
const cart = new Map();   // id -> qty
const items = new Map();  // id -> item (+ colour)
let name = localStorage.getItem('navrang_name') || '';
const money = (n) => cur + Math.round(n).toLocaleString('en-IN');

// Static icons
const put = (sel, html) => document.querySelectorAll(sel).forEach((e) => { e.outerHTML = html; });
put('.i-user', icon('user', 20)); put('.i-arrow', icon('arrow', 20)); put('.i-search', icon('search', 20));
put('.i-bag', icon('bag', 22)); put('.i-arrow-s', icon('arrow', 16)); put('.i-note', icon('note', 20));
document.querySelector('#nameScreen .badge').innerHTML = icon('utensils', 30);
$('closeX').innerHTML = icon('x', 20);
$('perks').innerHTML = [['sparkles', 'Freshly made'], ['clock', 'Order in seconds'], ['wallet', 'Pay at counter']]
  .map(([i, t]) => `<span class="perk">${icon(i, 16)}${t}</span>`).join('');

/* ---------------- Screens ---------------- */
let current = null;
async function show(screen) {
  const prev = current; current = screen;
  if (prev && prev !== screen) await animate($(prev), { opacity: 0, y: -12 }, { duration: 0.18 });
  for (const id of ['nameScreen', 'menuScreen', 'done']) $(id).classList.toggle('hidden', id !== screen);
  $('hero').classList.toggle('compact', screen === 'menuScreen');
  $('hiName').textContent = name;
  animate($(screen), { opacity: [0, 1], y: [16, 0] }, SOFT);
  updateCart();
}

/* ---------------- Menu ---------------- */
function renderMenu() {
  $('tabs').innerHTML = menu.categories.map((c, i) => {
    const [fill, ink] = NINE[i % 9];
    return `<button class="tab" style="--c:${fill};--ci:${ink}" data-i="${i}">${icon(catIcon(c.name), 16)}${esc(c.name)}</button>`;
  }).join('');
  $('menu').innerHTML = menu.categories.map((c, i) => {
    const [fill, ink] = NINE[i % 9];
    return `<section class="cat" id="cat${i}" style="--c:${fill};--ci:${ink}" aria-labelledby="h${i}">
      <h2 id="h${i}">${icon(catIcon(c.name), 22)}${esc(c.name)}</h2>
      ${c.items.map((it) => `
        <article class="item card" id="it-${it.id}" data-search="${esc((it.name + ' ' + (it.desc || '') + ' ' + c.name).toLowerCase())}">
          <div class="thumb">${it.image ? `<img src="${esc(it.image)}" alt="" loading="lazy">` : icon(catIcon(c.name), 30)}</div>
          <div class="info">
            <div class="nm">${it.veg ? '<span class="veg" title="Vegetarian" aria-label="Vegetarian"></span>' : ''}${esc(it.name)}${it.popular ? `<span class="hot">${icon('flame', 12)}Popular</span>` : ''}</div>
            ${it.desc ? `<p class="desc">${esc(it.desc)}</p>` : '<div style="height:8px"></div>'}
            <div class="row"><span class="price">${money(it.price)}</span><div id="ctl-${it.id}"></div></div>
          </div>
        </article>`).join('')}
    </section>`;
  }).join('') + `<div class="empty-search hidden" id="noResults">${icon('search', 28)}<p><b>No dishes found</b><br>Try another name.</p></div>`;
  for (const id of items.keys()) renderCtl(id, false);
  $('noResults').firstElementChild.style.margin = '0 auto';

  $('tabs').onclick = (e) => {
    const t = e.target.closest('.tab'); if (!t) return;
    $('cat' + t.dataset.i).scrollIntoView({ behavior: fx.reduce ? 'auto' : 'smooth', block: 'start' });
  };
  // Scroll spy: highlight the category currently on screen
  const io = new IntersectionObserver((entries) => {
    for (const en of entries) if (en.isIntersecting) setActiveTab(en.target.id.slice(3));
  }, { rootMargin: '-45% 0px -50% 0px' });
  document.querySelectorAll('section.cat').forEach((s) => io.observe(s));
  setActiveTab('0');
  fx.reveal(document.querySelectorAll('#menu .item'));
}
function setActiveTab(i) {
  document.querySelectorAll('.tab').forEach((t) => {
    const on = t.dataset.i === i;
    if (on && !t.classList.contains('on')) { t.scrollIntoView({ inline: 'center', block: 'nearest', behavior: fx.reduce ? 'auto' : 'smooth' }); }
    t.classList.toggle('on', on);
  });
}

$('search').oninput = () => {
  const q = $('search').value.trim().toLowerCase();
  let any = false;
  document.querySelectorAll('section.cat').forEach((s) => {
    let n = 0;
    s.querySelectorAll('.item').forEach((el) => { const m = !q || el.dataset.search.includes(q); el.style.display = m ? '' : 'none'; if (m) { n++; el.style.opacity = 1; } });
    s.style.display = n ? '' : 'none'; if (n) any = true;
  });
  $('noResults').classList.toggle('hidden', any);
};

function renderCtl(id, anim = true) {
  const el = $('ctl-' + id); if (!el) return;
  const q = cart.get(id) || 0;
  const wasQty = !!el.querySelector('.qty');
  const it = items.get(id);
  $('it-' + id).classList.toggle('in-cart', q > 0);
  if (q && wasQty) {
    const n = el.querySelector('span'); n.textContent = q; if (anim) fx.pop(n, 1.4); return;
  }
  el.innerHTML = q
    ? `<div class="qty"><button data-a="-" data-id="${id}" aria-label="Remove one ${esc(it.name)}">${icon('minus', 18)}</button><span aria-live="polite">${q}</span><button data-a="+" data-id="${id}" aria-label="Add one more ${esc(it.name)}">${icon('plus', 18)}</button></div>`
    : `<button class="add" data-a="+" data-id="${id}" aria-label="Add ${esc(it.name)}">ADD ${icon('plus', 16)}</button>`;
  if (anim) animate(el.firstElementChild, { scale: [0.7, 1], opacity: [0, 1] }, SPRING);
}

function change(id, d, src) {
  const before = cart.get(id) || 0;
  const q = Math.max(0, Math.min(50, before + d));
  q ? cart.set(id, q) : cart.delete(id);
  renderCtl(id); updateCart(); if (!$('sheet').classList.contains('hidden')) renderLines(id);
  if (d > 0 && before === 0) toast(`${items.get(id).name} added`);
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  change(b.dataset.id, b.dataset.a === '+' ? 1 : -1, b);
});

/* ---------------- Cart ---------------- */
function totals() {
  let count = 0, total = 0;
  for (const [id, q] of cart) { count += q; total += items.get(id).price * q; }
  return { count, total };
}
let barShown = false, lastCount = 0;
function updateCart() {
  const { count, total } = totals();
  const want = current === 'menuScreen' && count > 0;
  if (want && !barShown) { $('cartbar').classList.remove('hidden'); animate($('cartbar'), { y: [120, 0], opacity: [0, 1] }, SOFT); }
  if (!want && barShown) animate($('cartbar'), { y: 120, opacity: 0 }, { duration: 0.2 }).then(() => { if (!barShown) $('cartbar').classList.add('hidden'); });
  barShown = want;
  $('cartCount').textContent = count;
  if (count !== lastCount && count) fx.pop($('cartCount').parentElement, 1.15);
  lastCount = count;
  $('cartItems').textContent = `${count} item${count === 1 ? '' : 's'}`;
  fx.count($('cartTotal'), total, money);
  fx.count($('sheetTotal'), total, money);
  $('billSub').textContent = money(total);
  $('billItems').textContent = `Items (${count})`;
}
function renderLines(changedId) {
  $('cartFor').textContent = `Order for ${name}`;
  if (changedId && cart.has(changedId) && $('ln-' + changedId)) {
    const q = cart.get(changedId), it = items.get(changedId), row = $('ln-' + changedId);
    row.querySelector('.qty span').textContent = q; fx.pop(row.querySelector('.qty span'), 1.4);
    row.querySelector('.amt').textContent = money(it.price * q);
  } else {
    $('lines').innerHTML = [...cart].map(([id, q]) => {
      const it = items.get(id);
      return `<div class="line" id="ln-${id}"><span class="nm">${esc(it.name)}<br><small>${money(it.price)} each</small></span>
        <div class="qty"><button data-a="-" data-id="${id}" aria-label="Remove one ${esc(it.name)}">${icon('minus', 18)}</button><span>${q}</span><button data-a="+" data-id="${id}" aria-label="Add one more ${esc(it.name)}">${icon('plus', 18)}</button></div>
        <span class="amt">${money(it.price * q)}</span></div>`;
    }).join('') || '<p class="muted">Your cart is empty.</p>';
  }
  const { total } = totals();
  $('placeOrder').disabled = !cart.size;
  $('placeOrder').innerHTML = `Place order · ${money(total)}`;
  if (!cart.size) closeSheet();
}
function openSheet() {
  renderLines(); $('err').textContent = '';
  $('sheet').classList.remove('hidden'); $('sheetBg').classList.remove('hidden');
  animate($('sheetBg'), { opacity: [0, 1] }, { duration: 0.2 });
  animate($('sheet'), { y: ['100%', '0%'] }, { type: 'spring', stiffness: 380, damping: 36 });
  fx.enter(document.querySelectorAll('#lines .line'), { y: 10, delay: 0.1, gap: 0.04 });
  setTimeout(() => $('closeX').focus(), 50);
}
async function closeSheet() {
  if ($('sheet').classList.contains('hidden')) return;
  animate($('sheetBg'), { opacity: 0 }, { duration: 0.2 });
  await animate($('sheet'), { y: '100%' }, { duration: 0.22, ease: 'easeIn' });
  $('sheet').classList.add('hidden'); $('sheetBg').classList.add('hidden');
}
$('openCart').onclick = openSheet;
$('closeCart').onclick = closeSheet;
$('closeX').onclick = closeSheet;
$('sheetBg').onclick = closeSheet;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

let toastTimer;
function toast(msg) {
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = icon('check', 16) + esc(msg); document.body.appendChild(t);
  animate(t, { opacity: [0, 1], y: [16, 0], scale: [0.9, 1] }, SPRING);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => animate(t, { opacity: 0, y: 10 }, { duration: 0.2 }).then(() => t.remove()), 1400);
}

/* ---------------- Name ---------------- */
$('nameForm').onsubmit = (e) => {
  e.preventDefault();
  const v = $('nameInput').value.trim();
  if (!v) { $('nameErr').textContent = 'Please enter your name'; fx.shake($('nameInput')); $('nameInput').focus(); return; }
  $('nameErr').textContent = '';
  name = v; localStorage.setItem('navrang_name', name);
  show('menuScreen');
};
$('changeName').onclick = () => { $('nameInput').value = name; show('nameScreen'); setTimeout(() => $('nameInput').focus(), 250); };
addEventListener('scroll', () => $('bar').classList.toggle('scrolled', scrollY > 120), { passive: true });

/* ---------------- Place order ---------------- */
$('placeOrder').onclick = async () => {
  const btn = $('placeOrder');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Placing order…'; $('err').textContent = '';
  try {
    const r = await fetch('/api/orders', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, note: $('note').value, items: [...cart].map(([id, qty]) => ({ id, qty })) }) });
    const o = await r.json();
    if (!r.ok) throw new Error(o.error || 'Could not place order');
    localStorage.setItem('navrang_last_order', o.id);
    cart.clear(); $('note').value = '';
    await closeSheet();
    for (const id of items.keys()) renderCtl(id, false);
    showOrder(o, true);
  } catch (err) {
    $('err').textContent = err.message || 'Network problem — please try again';
    fx.shake(btn);
    renderLines();
  }
};

/* ---------------- Order tracker ---------------- */
let poll;
const STEPS = [['new', 'Received', 'receipt', 'var(--orange)'], ['preparing', 'Preparing', 'chef', 'var(--royal)'], ['ready', 'Ready', 'checkCircle', 'var(--green)']];
const STATUS_TEXT = { new: 'We got your order — it\'s in the queue', preparing: 'Our team is preparing your food', ready: 'Your order is ready! Please collect it', done: 'Collected — enjoy your food!', cancelled: 'This order was cancelled. Please ask at the counter.' };
function stepIndex(s) { return { new: 0, preparing: 1, ready: 2, done: 2 }[s] ?? -1; }

async function showOrder(o, celebrate = false) {
  const idx = stepIndex(o.status);
  $('done').innerHTML = `
    <div class="tick">${o.status === 'cancelled' ? icon('x', 44) : '<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path pathLength="100" d="M20 6 9 17l-5-5"/></svg>'}</div>
    <h2>${o.status === 'cancelled' ? 'Order cancelled' : `Thank you, ${esc(o.name)}!`}</h2>
    <p class="muted" style="margin:6px 0 0">Your order number</p>
    <div class="ordno rainbow-text" id="ordno">#${o.no}</div>
    ${o.status === 'cancelled' ? '' : `<div class="track" aria-label="Order progress">
      <div class="rail"></div><div class="fill" id="fill"></div>
      ${STEPS.map(([s, label, ic, c], i) => `<div class="step ${i <= idx ? 'on' : ''} ${i === idx && o.status !== 'done' ? 'now' : ''}" style="--c:${c}"><span class="dot">${icon(ic, 20)}</span>${label}</div>`).join('')}
    </div>`}
    <p class="statusline" id="statusline">${STATUS_TEXT[o.status]}</p>
    <div class="receipt">
      ${o.items.map((i) => `<div class="r"><span>${i.qty} × ${esc(i.name)}</span><span>${money(i.price * i.qty)}</span></div>`).join('')}
      <div class="r t"><span>Total</span><span>${money(o.total)}</span></div>
      ${o.note ? `<p class="muted" style="margin:8px 0 0;font-size:.88rem;display:flex;gap:6px">${icon('note', 16)}${esc(o.note)}</p>` : ''}
    </div>
    <p class="muted hint">${icon('clock', 16)}Show this screen at the counter — it updates automatically.</p>
    <button class="btn block" id="again" data-press>Order something else</button>`;
  await show('done');
  // Animations
  const path = $('done').querySelector('.tick path');
  animate($('done').querySelector('.tick'), { scale: [0.4, 1], rotate: [-20, 0] }, { type: 'spring', stiffness: 300, damping: 14, delay: 0.1 });
  if (path) animate(path, { strokeDashoffset: [100, 0] }, { duration: 0.5, delay: 0.3, ease: 'easeOut' });
  animate($('ordno'), { scale: [0.6, 1], opacity: [0, 1] }, { type: 'spring', stiffness: 260, damping: 12, delay: 0.25 });
  if ($('fill')) animate($('fill'), { width: ['0%', `${(idx / 2) * 66.67}%`] }, { duration: 0.8, delay: 0.4, ease: [0.2, 0.7, 0.3, 1] });
  fx.enter($('done').querySelectorAll('.step'), { delay: 0.3, gap: 0.08, y: 10 });
  if (celebrate || o.status === 'ready') setTimeout(() => fx.confetti($('ordno')), 350);
  const now = $('done').querySelector('.step.now .dot');
  if (now && fx.ok) Motion.animate(now, { scale: [1, 1.1, 1] }, { duration: 1.4, repeat: Infinity, ease: 'easeInOut' });

  $('again').onclick = () => { clearInterval(poll); localStorage.removeItem('navrang_last_order'); show('menuScreen'); };
  fx.pressable($('done'));
  clearInterval(poll);
  if (o.status !== 'done' && o.status !== 'cancelled') {
    poll = setInterval(async () => {
      const r = await fetch('/api/orders/' + o.id).catch(() => null);
      if (r && r.ok) {
        const n = await r.json();
        if (n.status !== o.status) { if (n.status === 'ready' && navigator.vibrate) navigator.vibrate([200, 100, 200]); showOrder(n); }
      }
    }, 5000);
  }
}

/* ---------------- Init ---------------- */
(async function init() {
  // Hero intro
  animate(document.querySelectorAll('.hero .mandala'), { scale: [0.3, 1], opacity: [0, .22] }, { duration: 1.2, ease: [0.2, 0.7, 0.3, 1] });
  menu = await (await fetch('/api/menu')).json();
  cur = menu.currency || '₹';
  $('stallName').innerHTML = esc(menu.stallName).split(' ').map((w) => `<span class="w">${w}</span>`).join(' ');
  fx.enter(document.querySelectorAll('#stallName .w'), { y: 24, gap: 0.08, scale: 0.9 });
  $('tagline').textContent = menu.tagline || '';
  animate($('tagline'), { opacity: [0, 1] }, { duration: 0.6, delay: 0.3 });
  document.title = menu.stallName + ' · Menu';
  menu.categories.forEach((c) => c.items.forEach((it) => items.set(it.id, it)));
  renderMenu();
  fx.pressable();

  const last = localStorage.getItem('navrang_last_order');
  if (name && last) {
    const r = await fetch('/api/orders/' + last).catch(() => null);
    if (r && r.ok) { const o = await r.json(); if (o.status !== 'done' && o.status !== 'cancelled') return showOrder(o); }
  }
  if (name) { $('nameInput').value = name; show('menuScreen'); } else show('nameScreen');
})();
</script>
</body>
</html>
